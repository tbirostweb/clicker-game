<VirtualHost *:80>
    ServerName clicker-api.theo-birost.fr
    DocumentRoot /var/www/html/public

    # Request hardening: small JSON API, no uploads.
    LimitRequestBody 16384
    Timeout 30

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Security headers for a JSON-only API (HSTS is set by the HTTPS proxy).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always unset X-Powered-By

    ErrorLog /dev/stderr
    # Minimised access log: no User-Agent/Referer. IPs are kept for abuse
    # handling; retention is the hosting log retention (see privacy notice).
    LogFormat "%a %t \"%r\" %>s %b %D" minimal
    CustomLog /dev/stdout minimal
</VirtualHost>
