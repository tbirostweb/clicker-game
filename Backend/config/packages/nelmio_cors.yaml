# CORS_ALLOW_ORIGIN: ONE exact origin (no regex, no wildcard), e.g.
# "https://portfolio.theo-birost.fr" in production, "http://localhost:5173"
# for local development. CORS only restricts
# browsers: write access is protected by the per-run edit token.
nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Idempotency-Key', 'X-Edit-Token']
        allow_credentials: false
        max_age: 3600
    paths:
        '^/api/': ~
